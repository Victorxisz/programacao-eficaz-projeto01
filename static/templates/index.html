<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Get-it</title>
<link rel="stylesheet" href="static/templates/styles/style.css">
<link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body>
<header>
<img
class="logo" 
src="{{{{ url_for('static', filename='img/logo-getit.png') }}}}">

</header>
  <form class="add_note" action="/submit" method="POST">

    <input id="detalhes" name="detalhes" required />
    <input class="btn-submit" type="submit" value="Adicionar nota" />
  </form>

<ul>
{notes}
</ul>

</body>
</html>
