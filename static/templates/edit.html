<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Get-it</title>
<link rel="stylesheet" href="/static/templates/styles/style.css">
<link 
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
          rel="stylesheet">
</head>
<body>
<header>
<img
class="logo" 
src="{{{{ url_for('static', filename='img/logo-getit.png') }}}}">
<h1 class="logo-texto">Editar Anotação</h1>
</header>
  <form class="add_note" action="/update/{id}" method="POST">

    <label for="titulo">Título</label>
        <input id="titulo" type="text" name="title" value="{title}" required />

    <label for="detalhes">Detalhes</label>
        <input id="detalhes" name="content" value="{content}" required />
        
    <input class="btn-submit" type="submit" value="EDITAR" />
  </form>


</body>
</html>
